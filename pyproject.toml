[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferscope"
version = "0.1.0"
description = "轻量级 LLM Serving Runtime 分析工具"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ruqi1125"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inferscope = "inferscope.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
